<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>品詞と働きドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
<style>
/* VOICE: 落ち着いた自習ノート。余計な装飾なし
   IDEA: 参考書の練習問題に赤ペンで品詞と矢印を書き込むワークブック
   PICTURE: 大きな英文そのもの。下に品詞ラベルと赤い修飾の矢印が描かれる
   COLOUR and TYPE: 紙の白・墨色・赤ペンのマゼンタ。英文はBaskerville、日本語はNoto Sans JP
   LAYOUT: Lessonタブ→進捗→英文と矢印→選択パネル→答え合わせ */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf6,#17161a);--card:light-dark(#ffffff,#211f25);--ink:light-dark(#1b1a1f,#ecebef);--sub:light-dark(#6b6872,#a3a0aa);--line:light-dark(#e3e0d8,#34313a);--red:light-dark(#b0185a,#ff6fa8);--ok:light-dark(#1d7a4a,#5fd39a);--ng:light-dark(#c0392b,#ff7b6b);--chip:light-dark(#f2efe8,#2b2930)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans JP",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:20px max(4vw,14px) 48px}
h1{font-size:clamp(24px,5vw,32px);line-height:1.1;margin:0 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.tab{flex:none;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:left;line-height:1.25}
.tab small{display:block;font-size:11px;color:var(--sub)}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.tab.on small{color:var(--bg);opacity:.75}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--sub);cursor:pointer;padding:0}
.dot.mc{border-radius:7px}
.dot.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.dot.cur{outline:2px solid var(--red);outline-offset:1px}
.score{font-size:14px;color:var(--sub);white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px}
.qno{font-size:13px;color:var(--sub);margin:0 0 6px}
.scroll{overflow-x:auto;padding-bottom:4px}
.row{position:relative;display:flex;gap:16px;padding:4px 6px 70px;width:max-content;min-width:100%;justify-content:center}
.col{display:flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:10px;padding:4px 5px;border:2px solid transparent;background:none;color:inherit;font:inherit}
.col.tight{margin-left:-14px}
.col:focus-visible{outline:2px solid var(--red)}
.col.sel{background:var(--chip);border-color:var(--red)}
.col.ok{border-color:var(--ok)}.col.ng{border-color:var(--ng)}
.ja{font-size:12px;color:var(--sub);white-space:nowrap;min-height:19px}
.en{font:700 clamp(21px,5.2vw,29px)/1.2 "Libre Baskerville",Georgia,serif;white-space:nowrap}
.pos{margin-top:4px;min-width:34px;height:26px;border-bottom:2px dashed var(--line);color:var(--red);font-weight:700;font-size:16px;text-align:center;white-space:nowrap}
.pos sup{font-size:11px}.pos .x{color:var(--sub);font-weight:400}
svg.arcs{position:absolute;left:0;bottom:0;height:66px;pointer-events:none;overflow:visible}
.panel{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.panel h3{font-size:15px;margin:0 0 8px}
.panel h3 b{font-family:"Libre Baskerville",Georgia,serif}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.b{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.b.on{background:var(--red);border-color:var(--red);color:#fff}
.b.right{background:var(--ok);border-color:var(--ok);color:#fff}
.b.wrong{background:var(--ng);border-color:var(--ng);color:#fff}
.b:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mcq{font-size:18px;font-weight:700;margin:4px 0 14px;line-height:1.5}
.mcq em{font-style:normal;font-family:"Libre Baskerville",Georgia,serif;background:var(--chip);padding:1px 6px;border-radius:6px}
.mco{display:grid;gap:8px}
.hint{font-size:13px;color:var(--sub);margin:0}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700;flex:1;text-align:center}
.res{margin-top:14px;padding:14px;border-radius:10px;background:var(--chip);display:none}
.res.show{display:block}
.res .v{font-weight:700;font-size:17px;margin:0 0 6px}
.res .v.ok{color:var(--ok)}.res .v.ng{color:var(--ng)}
.res p{margin:4px 0;font-size:15px}
.ans{font-family:"Libre Baskerville",Georgia,serif;font-size:14px;overflow-wrap:anywhere}
.mode{display:flex;gap:6px;margin-bottom:12px}.mode .b{flex:1;text-align:center}
.notes{margin:0;padding-left:1.2em}.notes li{margin:0 0 10px;line-height:1.7}.notes b{color:var(--red)}.notes i{font-family:"Libre Baskerville",Georgia,serif;font-style:normal}
.legend{margin-top:18px;font-size:13px;color:var(--sub);line-height:1.8}
.legend b{color:var(--red)}
.reset{background:none;border:none;color:var(--sub);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>品詞と働きドリル</h1>
  <p class="lead">薬袋善郎『英語リーディング教本』に沿った自作の練習問題。各Lessonの要点を読んでから問題へ。丸い番号は英文の分析、四角い番号は確認問題です。</p>
  <div class="tabs" id="tabs"></div>
  <div class="mode" id="mode"><button class="b" data-m="learn">要点を読む</button><button class="b" data-m="drill">問題を解く</button></div>
  <div class="bar" id="barw"><div class="dots" id="dots"></div><span class="score" id="score"></span></div>
  <div class="card">
    <p class="qno" id="qno"></p>
    <div id="body"></div>
    <div class="acts">
      <button class="b" id="prev">← 前へ</button>
      <button class="b main" id="check">答え合わせ</button>
      <button class="b" id="next">次へ →</button>
    </div>
    <div class="res" id="res"></div>
  </div>
  <p class="legend" id="legend"></p>
  <button class="reset" id="reset">このLessonの進捗をリセット</button>
</div>
<script>
{
// 分析問題の各語: [英語, 意味, 記号, 修飾先(番号) / 'C'=補語 / null=なし / '*'=判定しない]
// 記号: n v a ad S V I(誘導ad) X(冠詞＝何も書かない)
const P=(w,tr,ex)=>({t:"p",w,tr,ex});
const M=(q,o,a,ex)=>({t:"m",q,o,a,ex});
const LS=[
{name:"Lesson 1",notes:["<b>品詞</b>は語の種類、<b>働き</b>はその語が他の語に対してもつ関係。この2つは厳密に区別する。", "<b>名詞 n</b>：生物・物体・事柄の名称。<b>動詞 v</b>：行動・動き・変化を表す語。", "<b>形容詞 a</b>：どんな名詞かを説明する語。働きは<b>名詞修飾</b>か<b>補語</b>の2つだけ。", "<b>修飾</b>＝他の語の助けを借りずに直接説明すること。矢印で示す。", "<b>補語 C</b>＝動詞の助けを借りて、間接的に名詞を説明する働き（That milk became <i>cold</i>）。形容詞の補語は ªC と書く。", "<b>副詞 ad</b>：動詞（いつ・どこで・どのように）、形容詞、他の副詞を修飾する。文全体を修飾することもある。", "同じつづりでも品詞は文の中での役割で決まる（a <i>fast</i> car は a、run <i>fast</i> は ad）。"],sub:"4つの品詞",keys:["n","v","a","ad"],items:[
 P([["run","走る","v",null],["very","非常に","ad",2],["fast","速く","ad",0]],"非常に速く走る","fast は動詞 run を修飾する副詞。very は副詞 fast を修飾する副詞（他の副詞修飾）です。"),
 P([["drink","飲む","v",null],["hot","熱い","a",2],["coffee","コーヒー","n",null]],"熱いコーヒーを飲む","hot は名詞 coffee を直接説明しているので形容詞、働きは名詞修飾です。"),
 P([["extremely","極めて","ad",1],["beautiful","美しい","a",2],["flowers","花","n",null]],"極めて美しい花","beautiful は flowers を修飾する形容詞。extremely は形容詞 beautiful を修飾する副詞です。"),
 P([["This","この","a",1],["soup","スープ","n",null],["tastes","味がする","v",null],["really","本当に","ad",4],["good","良い","a","C"]],"このスープは本当においしい","This は soup を直接説明する名詞修飾。good は動詞 tastes の助けを借りて soup を説明するので補語。really は good を修飾する副詞。"),
 P([["speak","話す","v",null],["quite","かなり","ad",2],["slowly","ゆっくり","ad",0]],"かなりゆっくり話す","slowly は動詞 speak を修飾する副詞、quite は副詞 slowly を修飾する副詞です。"),
 P([["drive","運転する","v",null],["fast","速い","a",2],["cars","車","n",null]],"速い車を運転する","ここの fast は名詞 cars を説明しているので形容詞。同じ fast でも何を説明するかで品詞が変わります。"),
 P([["drive","運転する","v",null],["cars","車","n",null],["fast","速く","ad",0]],"車を速く運転する","こちらの fast は動詞 drive を「どのように」と説明しているので副詞です。"),
 P([["That","その","a",1],["girl","少女","n",null],["became","なった","v",null],["very","非常に","ad",4],["famous","有名な","a","C"]],"その少女はとても有名になった","That は girl を修飾。famous は became の助けを借りて girl を説明する補語。very は famous を修飾する副詞。"),
 P([["completely","完全に","ad",1],["new","新しい","a",2],["information","情報","n",null]],"完全に新しい情報","new は information を修飾する形容詞、completely は形容詞 new を修飾する副詞です。"),
 P([["come","来る","v",null],["home","家へ","ad",0],["early","早く","ad",0]],"早く家に帰る","home（どこへ）と early（いつ）は、どちらも動詞 come を修飾する副詞です。"),
 P([["really","本当に","ad",1],["kind","親切な","a","*"]],"本当に親切な","kind は形容詞。名詞修飾か補語かはこの2語だけではわからないので、品詞だけ合っていれば正解です。"),
 P([["eat","食べる","v",null],["delicious","おいしい","a",3],["fresh","新鮮な","a",3],["fruit","果物","n",null]],"おいしい新鮮な果物を食べる","delicious も fresh も名詞 fruit を修飾する形容詞。形容詞どうしは修飾しあいません。"),
 P([["Those","それらの","a",1],["students","学生たち","n",null],["look","見える","v",null],["very","とても","ad",4],["tired","疲れた","a","C"]],"その学生たちはとても疲れているように見える","tired は look の助けを借りて students を説明する補語です。"),
 P([["work","働く","v",null],["very","非常に","ad",2],["hard","熱心に","ad",0]],"非常に熱心に働く","hard は動詞 work を修飾する副詞、very は副詞 hard を修飾する副詞です。")
]},
{name:"Lesson 2",notes:["動詞の形は<b>原形・現在形・過去形・過去分詞形・ing形</b>の5つ。まとめて<b>活用</b>と呼ぶ。未来形という活用はない。", "「活用を言いなさい」→ 原形・過去形・過去分詞形の3つを答える（eat—ate—eaten）。", "<b>規則活用</b>：過去形・過去分詞形が原形＋ed。そうでないものは不規則活用。", "この本では Lesson 5 まで現在形と過去形の動詞しか出てこない約束（だから began や bought は過去形と決まる）。", "代名詞は原則として名詞として扱う。", "<b>所有格</b>（my, your, Tom's）は「品詞は形容詞、働きは名詞修飾、呼び名は所有格」。", "<b>冠詞</b>（a, an, the）は名詞を修飾する特殊な形容詞。下には品詞も働きも書かない。", "a/an：数えられる単数の名詞に付く。the：聞き手にわかるはずの名詞、一つしかないもの、「〜というもの」（総称）に付く。", "<b>名詞＋名詞</b>で1つの名詞になることがある（bus stop）。下線を引いて n と書く。"],sub:"活用・所有格・冠詞",keys:["n","v","a","ad","X"],items:[
 P([["opened","開けた","v",null],["the","","X",null],["old","古い","a",3],["door","ドア","n",null]],"古いドアを開けた","冠詞 the の下には何も書きません。old は door を修飾する形容詞です。"),
 P([["Ken's","ケンの","a",2],["new","新しい","a",2],["bike","自転車","n",null]],"ケンの新しい自転車","Ken's は「品詞は形容詞、働きは名詞修飾、呼び名は所有格」。new も bike を修飾します。"),
 P([["wrote","書いた","v",null],["a","","X",null],["long","長い","a",3],["letter","手紙","n",null]],"長い手紙を書いた","不定冠詞 a も品詞・働きは記入しません。long は letter を修飾する形容詞です。"),
 P([["your","あなたの","a",1],["tennis racket","テニスラケット","n",null]],"あなたのテニスラケット","tennis racket は名詞＋名詞で1つの名詞。your はそれを修飾する所有格の形容詞です。"),
 P([["ate","食べた","v",null],["an","","X",null],["apple","リンゴ","n",null],["yesterday","昨日","ad",0]],"昨日リンゴを食べた","yesterday は「いつ」食べたかを説明するので、動詞 ate を修飾する副詞です。"),
 P([["her","彼女の","a",2],["kind","親切な","a",2],["smile","笑顔","n",null]],"彼女の優しい笑顔","her（所有格）も kind も名詞 smile を修飾する形容詞です。"),
 P([["taught","教えた","v",null],["science","理科","n",null],["very","非常に","ad",3],["clearly","わかりやすく","ad",0]],"理科を非常にわかりやすく教えた","clearly は動詞 taught を修飾、very は副詞 clearly を修飾します。"),
 P([["the","","X",null],["bus stop","バス停","n",null]],"そのバス停","bus stop は名詞＋名詞で1つの名詞。the には何も書きません。"),
 M("動詞の5つの形をすべて正しく並べたものは？",["原形・現在形・過去形・過去分詞形・ing形","原形・現在形・過去形・未来形・ing形","原形・現在分詞形・過去形・過去分詞形・ing形"],0,"活用は5つ。「未来形」という活用はなく、この本では ing形を現在分詞形とは呼びません。"),
 M("<em>eat</em> の活用を言いなさい（原形—過去形—過去分詞形）",["eat—ate—eaten","eat—eated—eated","eat—ate—ate"],0,"eat は不規則活用です。「活用を言いなさい」と言われたら、原形・過去形・過去分詞形の3つを答えます。"),
 M("<em>made</em> は何形？（この本は Lesson 5 まで現在形と過去形しか出ない約束）",["原形","現在形","過去形"],2,"make—made—made。made は過去形か過去分詞形ですが、この約束のもとでは過去形です。"),
 M("<em>my</em>・<em>your</em>・<em>Tom's</em> の品詞と働きは？",["形容詞・名詞修飾","名詞・主語","代名詞・名詞修飾"],0,"これらは「品詞は形容詞、働きは名詞修飾、呼び名は所有格」と扱います。"),
 M("規則活用とは？",["過去形と過去分詞形が原形に ed を付けたつづりになる活用","現在形に s が付く活用","5つの形がすべて同じつづりになる活用"],0,"answer—answered—answered のように ed が付くのが規則活用です。")
]},
{name:"Lesson 3",notes:["<b>主語 S</b>：動詞の行動・変化の主体となる名詞。主語になれるのは名詞（相当語句）だけ。主語の品詞は書かなくてよい。", "<b>述語動詞 V</b>：主語とセットになる動詞。大文字の V で表す。", "<b>文＝構造上の主語＋述語動詞</b>。英文（大文字で始まりピリオドで終わる語群）とは区別する。", "<b>現在形・過去形の動詞は絶対に述語動詞になる</b>。逆に、動詞は述語動詞にならないこともある。", "<b>be動詞</b>：意味は「ある・いる・存在する」と「〜である」の2つ。活用は be—am, is, are—was, were—been—being。", "be動詞以外の動詞は<b>一般動詞</b>。", "<b>誘導副詞 there</b>：述語動詞を主語の前に引き出す（There V S.）。there 自体に意味はなく、下に「誘導ad」と書く。", "状態を表す語が形容詞か動詞か（familiar／know）、形容詞の補語か副詞の動詞修飾か（felt hungry／felt differently）は辞書で確かめる。"],sub:"文・be動詞・誘導副詞 there",keys:["S","V","n","a","ad","I","X"],items:[
 P([["Mike","マイク","S",null],["quickly","すぐに","ad",2],["finished","終えた","V",null],["his","彼の","a",4],["homework","宿題","n",null]],"マイクはすぐに宿題を終えた","finished は過去形なので絶対に述語動詞（V）。Mike finished で「構造上の主語＋述語動詞」＝文です。"),
 P([["The","","X",null],["room","部屋","S",null],["was","だった","V",null],["quiet","静かな","a","C"]],"その部屋は静かだった","was は be動詞の過去形で「〜であった」。quiet は was の助けを借りて room を説明する補語です。"),
 P([["There","","I",null],["are","ある","V",null],["many","たくさんの","a",3],["stars","星","S",null],["tonight","今夜","ad",1]],"今夜はたくさんの星が出ている","There は誘導副詞で、述語動詞 are を主語 stars の前に引き出しています。tonight は are を修飾します。"),
 P([["My","私の","a",1],["father","父","S",null],["became","なった","V",null],["angry","怒った","a","C"]],"父は怒った","angry は became の助けを借りて father を説明する補語です。"),
 P([["She","彼女","S",null],["sang","歌った","V",null],["beautifully","美しく","ad",1]],"彼女は美しく歌った","beautifully は「どのように」歌ったかを説明するので、動詞を修飾する副詞です。次の問題と比べてください。"),
 P([["She","彼女","S",null],["looked","見えた","V",null],["beautiful","美しい","a","C"]],"彼女は美しく見えた","beautiful は形容詞で、looked の助けを借りて She を説明する補語。「美しく」と訳しても副詞ではありません。"),
 P([["Your","あなたの","a",1],["bag","かばん","S",null],["is","ある","V",null],["here","ここに","ad",2]],"あなたのかばんはここにある","is は「ある・いる・存在する」の意味。here は is を修飾する副詞です。"),
 P([["The","","X",null],["children","子供たち","S",null],["played","遊んだ","V",null],["happily","楽しく","ad",2]],"子供たちは楽しく遊んだ","happily は played を修飾する副詞です。"),
 M("文とは？",["構造上の主語＋述語動詞","大文字で始まりピリオドで終わる語群","主語＋目的語"],0,"大文字で始まりピリオドで終わる語群は「英文」と呼んで区別します。"),

{name:"Lesson 5",sub:"前置詞・動詞型",num:1,keys:["S","V","O","n","a","ad","前","X"],notes:[
"<b>前置詞</b>（of, to, in, on など）は後ろの名詞と結びつき、<b>前置詞＋名詞</b>で<b>形容詞句</b>か<b>副詞句</b>になる。前置詞と結びついた名詞の働きは<b>前置詞の目的語</b>（記号はない）。",
"このドリルでは、前置詞の下に「前」と書き、前置詞＋名詞のかたまりが修飾する語を前置詞から矢印で選ぶ。",
"<b>目的語</b>は2種類：前置詞の目的語と<b>動詞の目的語 O</b>。O＝前置詞が付いていなくて、主語（または先に出ている O）とイコールでない名詞。",
"<b>主格／目的格</b>の代名詞：I—me、we—us、you—you、he—him、she—her、it—it、they—them。",
"<b>補語 C</b>：形容詞は動詞の助けを借りて主語か O を説明するとき補語（ªC）。名詞は前置詞が付いていなくて主語か O とイコールのとき補語（ⁿC）。名詞と形容詞では判断の仕方が違う。",
"<b>① 完全自動詞</b>（V）：目的語も補語も付かない。be動詞①＝ある・いる・存在する。",
"<b>② 不完全自動詞</b>（VC）：補語だけが付く。be動詞②＝〜である。",
"<b>③ 完全他動詞</b>（VO）：動詞の目的語が1つ付く。",
"<b>④ 授与動詞</b>（VOO）：前の O を<b>間接目的語</b>、後ろの O を<b>直接目的語</b>という。基本的意味は<b>与える・与えない・取り去る</b>。",
"<b>⑤ 不完全他動詞</b>（VOC）：O と C の間に「O が C である／O が C する」という<b>意味上の主語・述語関係</b>がある。基本的意味は<b>認識する・生み出す</b>。",
"<b>⑤ O as C</b>：regard／think of／look on（考える）、describe／speak of／refer to（言う）。think of のように前置詞などが付いて1つの動詞になるものを<b>群動詞</b>という。",
"<b>自動詞</b>＝①②（O が付かない）、<b>他動詞</b>＝③④⑤（O が付く）。<b>完全動詞</b>＝①③④、<b>不完全動詞</b>＝②⑤。",
"動詞に当てる<b>3本のスポットライト</b>：①述語動詞か準動詞か ②活用は何形か ③動詞型は何番か（＝動詞の働き）。",
"<b>4品詞の働き</b>：動詞（①〜⑤・−③〜−⑤）、名詞（主語・動詞の目的語・前置詞の目的語・補語）、形容詞（名詞修飾・補語）、副詞（動詞修飾・形容詞修飾・他の副詞修飾・文修飾）。",
"動詞の番号は丸暗記しなくてよい。出てきたとき、使いたいときに辞書で確認する。"],

{name:"Lesson 6",sub:"助動詞・否定文・疑問文",num:1,keys:["S","aux","V","O","n","a","ad","前","I","X"],notes:[
"<b>助動詞 aux</b>は動詞の前に付いて表現の幅を広げる（意味を添える／否定文・疑問文を作る）。助動詞が付いた状態を「<b>着物を着ている</b>」、付いていない状態を「<b>裸</b>」と呼ぶ。",
"助動詞は4種類：<b>be助動詞</b>（過去分詞形・ing形に付く）、<b>have助動詞</b>（過去分詞形に付く）、<b>do助動詞</b>（原形に付く）、<b>一般助動詞</b>（原形に付く）。",
"活用：be助動詞は5つすべて、have助動詞は原形・現在形・過去形・ing形、do助動詞は原形・現在形・過去形、<b>一般助動詞は現在形と過去形だけ</b>。3単現は is・has・does。",
"can＝能力・可能性・許可、may＝推量・許可、should＝義務（活用は過去形だが過去の意味ではない）。",
"be助動詞の前にはすべての助動詞、have助動詞の前には一般助動詞だけが置ける。<b>do助動詞・一般助動詞の前には何も置けない</b>。",
"<b>助動詞が現在形か過去形なら、後ろの動詞は何形でも必ず述語動詞</b>。一般助動詞は現在形・過去形しかないので、一般助動詞が付いた動詞は必ず述語動詞。",
"<b>否定文</b>：be動詞や助動詞の後ろに not。裸の一般動詞は原形にして do を付け、その後に not（Betty does not cut ...）。can not は cannot か can't にする。",
"never は be動詞の直後・一般動詞の直前に置く。<b>no＋名詞</b>は頭の中で not＋any に分解して読む。-thing で終わる代名詞にかかる形容詞は後ろに置く（nothing interesting）。",
"<b>疑問文の語順</b>：裸の be動詞は be動詞を、着物を着ていれば助動詞を主語の前に出す。裸の一般動詞は do を主語の前に置き、動詞を原形に。there 構文は there を主語のように扱う。",
"<b>疑問詞</b>＝疑問代名詞（who, whom, what, which）、疑問形容詞（whose, what, which）、疑問副詞（when, where, why, how）。疑問詞を文頭に出し、後は疑問文の語順。",
"<b>主部に疑問詞が含まれるとき</b>は普通の文と同じ語順（Who broke this window?）。今の英語では文頭の whom の代わりに who を使うのが普通。",
"Yes, she does. の does のように、一般動詞を中心とした語群の代わりをする do を<b>代動詞</b>という。",
"<b>否定疑問文</b>の答え方は日本語と逆：英語は内容が肯定なら Yes、否定なら No。"],

"ing形に付く助動詞は be助動詞だけ。「裸のing」＝be助動詞が付いていない ing。現在分詞・過去分詞の「現在」「過去」は時を表さない、ただの符丁。",
"<b>進行形</b>＝be助動詞＋ing形の動詞で「〜している」。",
"<b>2つの捉え方</b>：〔辞書〕be を aux、ing形を動詞として別々に扱う。〔学校文法〕be＋ing をまとめて1つの動詞と捉え、活用は be の形で決める（is reading＝現在形・述語動詞・③）。通常は学校文法で答える。",
"進行形の動詞の ing形（being -ing）は実際には使われない。",
"<b>動作動詞</b>は進行形になるが、<b>状態動詞</b>（have, know, depend, contain, own, resemble, belong）はならない。ただし be動詞②は進行形になり「<b>一時的状態</b>」を表す（I am being careful）。be動詞①は進行形にならない。",
"進行形の意味は4つ：<b>進行中・反復的動作・一時的状態・近い未来の予定</b>（Autumn is approaching ／ I am constantly forgetting ... ／ We are starting this evening）。",
"進行形に付けられる助動詞：have（完了進行形 have been -ing）、Don't（否定命令文 Don't be -ing）、一般助動詞（may be -ing）。",
"否定文は助動詞の後に not、疑問文は主語の前に助動詞を出す（Is he waiting ...? ／ Has he been waiting ...?）。主部に疑問詞があれば普通の語順。",
"<b>進行形に似て非なる表現</b>：missing（行方不明の）のような純粋な形容詞は ② ªC。fishing（釣ること）は動名詞で ② ⁿC。puzzling（人を当惑させるような）は現在分詞形容詞用法。",

{name:"Lesson 8",sub:"受身",num:1,keys:["S","aux","V","O","n","a","ad","前","X"],notes:[
"過去分詞形は <b>p.p.</b> と表す。<b>p.p.の可能性</b>：受身・完了（着物を着ている／述語動詞にも準動詞にもなる）、過去分詞形容詞用法・分詞構文（裸／必ず準動詞）。",
"受身の着物は be助動詞、完了の着物は have助動詞。p.p. で文を作るには、受身か完了にするしかない。",
"<b>受身の作り方</b>：①能動態の文の O を主語にする ②述語動詞を p.p. にして be助動詞を付ける ③元の主語は by〜 の副詞句にして文末に置く。",
"受身になると目的語が1つ減る：S③O → S−③、S④OO → S−④O、S⑤OC → S−⑤C。受身の動詞型は能動態に直さず、後ろに何があるかで決める。",
"受身にできない他動詞もある：have（持っている）、become（似合う）、resemble、enter など。",
"④を③に書き換えたとき<b>to</b>になる動詞（give, bring, sell, send, show）は −④にできる。<b>for</b>になる動詞（buy, get, make, choose, cook, call）は原則 −④にできず、S −③ for 名詞 にする。",
"心理状態（surprise など）や損傷（injure, delay など）を表す動詞の受身は「〜される」が薄れ、「〜する」（①の意味）になることが多い。",
"受身にはすべての助動詞を付けられる：be being p.p.（受身進行形）、have been p.p.（完了受動態）、Don't be p.p.（受身の否定命令文）、一般助動詞＋be p.p.。",
"否定文は助動詞の後に not、疑問文は主語の前に助動詞を出す（Is this fish eaten ...? ／ Has this skirt been ironed yet?）。yet は否定文で「まだ」、疑問文で「もう」。",
"only や even は「限定詞が付いた名詞全体」を丸ごと修飾できる。",
"<b>受身</b>＝能動態の文の「動詞の目的語」を主語にした文。受身にできるのは<b>他動詞</b>（③④⑤）だけで、自動詞（①②）は受身にできない。",
"受身の動詞型は <b>−③・−④・−⑤</b>。−③の後ろには何もない（あれば副詞要素）、−④の後ろには動詞の目的語、−⑤の後ろには補語が来る。",
"受身形の動詞は<b>動作</b>（〜される）と<b>状態</b>（〜されている）の両方を表す。",
"<b>受身に似て非なる表現①</b>：過去分詞形が純粋な形容詞に変わっている場合は受身ではなく「② ªC」（You are <i>mistaken</i>＝あなたは勘違いしている）。",
"動詞は very ではなく much で修飾する。<i>very</i> interested なら interested は形容詞（②の補語）、<i>much</i> interested なら受身の動詞。",
"<b>受身に似て非なる表現②</b>：①の動詞（go, come, arrive など往来発着）の過去分詞に be を付けると「<b>完了</b>」（Winter <i>is gone</i>＝冬は去ってしまった）。",
"疑問文の形を借りて自分の主張を伝える英文を<b>修辞疑問文</b>という（What can be said?＝何が言えようか、何も言えない）。",
"<b>活用の重層構造</b>（コラム5）：受身・進行形は2回活用を確認する。〔辞書の捉え方〕be助動詞と動詞を別々に、〔学校文法の捉え方〕be助動詞＋動詞をまとめて1つの動詞と考える。このドリルの V は学校文法の捉え方で答える。"],

{name:"Lesson 9",sub:"完了",num:1,keys:["S","aux","V","O","a","ad","X"],notes:[
"<b>完了</b>＝have助動詞＋過去分詞形の動詞。辞書も学校文法も have と過去分詞を別の語として扱う（have は aux、p.p. に動詞の番号を書く）。",
"have が<b>原形</b>なら「完了形」、<b>現在形</b>（have / has）なら「<b>現在完了</b>」、<b>過去形</b>（had）なら「<b>過去完了</b>」。have助動詞には過去分詞形がない。",
"<b>本質的な意味</b>：単純な現在形は現在の状態を直接表す。現在完了は「現在の状態を生み出した原因である<b>過去の動作・状態</b>」を表して、<b>現在の状態</b>を間接的に伝える。",
"だから現在完了は yesterday など<b>過去の時を明示する語句と一緒に使えない</b>。単純な過去形は過去のことを言うだけで、今の状態はわからない。",
"<b>表面的な意味</b>は4つ：完了（〜してしまった）・結果（〜した）・経験（〜したことがある）・継続（〜し続けてきた）。just・already（完了）、before・once・again（経験）、for・since（継続）などの副詞が目印。",
"<b>have gone</b>＝行ってしまって今いない（完了）、<b>have been to</b>＝〜へ行ったことがある（経験）。",
"<b>完了進行形</b> have been -ing は動作動詞で「基準時までの継続」を表す。状態動詞（know など）は進行形にならず、have p.p. で継続を表す。<b>完了受動態</b>は have been p.p.。",
"助動詞を重ねる順番：<b>一般助動詞 → have → 進行形の be → 受身の be</b>（will have been being p.p.）。",
"<b>一般助動詞＋have p.p.</b>：must have p.p.＝〜したに違いない、can't have p.p.＝〜したはずがない、may have p.p.＝〜したかもしれない。単なる過去を表すことも多い。",
"否定文は have の後に not、疑問文は have を主語の前に出す。",
"<b>過去完了</b>：普通用法は基準時が過去の一時点（By that time I had finished）。大過去用法は、起こった順と逆に書くとき前の出来事を had p.p. で示す。",
"<b>未来完了</b> will have p.p. は未来の一時点の状態を伝える。",
"<b>英語の仕組み</b>（コラム6）：英語は4品詞・働き・活用で成り立つ。現在形・過去形は必ず述語動詞、原形・過去分詞形・ing形は述語動詞にも準動詞にもなる。まずは赤字の「仕組み」に直結する部分を身につける。"],

 P([["He","彼","S",null],["has","","aux",null],["gone","行った","V","①"],["home","家へ","ad",2]],"彼は家に帰ってしまった","have gone は「行ってしまって今いない」（完了）。home は gone を修飾する副詞です。"),
 P([["Have","","aux",null],["you","あなた","S",null],["ever","今までに","ad",3],["seen","見た","V","③"],["a","","X",null],["koala","コアラ","O",null]],"コアラを見たことがありますか","疑問文なので have が主語の前に出ます。ever があるので表面的意味は「経験」。"),
 P([["We","私たち","S",null],["have","","aux",null],["been waiting","待っている","V","①"],["long","長い間","ad",2]],"私たちは長い間待っている","完了進行形。学校文法の捉え方では been waiting をまとめて過去分詞形・述語動詞・①と見ます。「基準時までの継続」を表します。"),
 P([["The","","X",null],["work","仕事","S",null],["has","","aux",null],["been finished","終えられた","V","-③"],["already","すでに","ad",3]],"その仕事はすでに終わっている","完了受動態 has been p.p.。been finished は −③。already は「完了」の目印です。"),
 P([["He","彼","S",null],["may","かもしれない","aux",null],["have","","aux",null],["lied","うそをついた","V","①"]],"彼はうそをついたのかもしれない","may は助動詞の現在形、have は原形なので現在完了ではなく「完了形」。may have p.p. で「〜したかもしれない」。"),
 P([["They","彼ら","S",null],["had","","aux",null],["already","すでに","ad",3],["left","出発した","V","①"]],"彼らはすでに出発していた","had は助動詞・過去形なので過去完了。過去の一時点ですでに出発し終えていたことを表します。"),
 P([["I","私","S",null],["have","","aux",null],["always","ずっと","ad",3],["liked","好きだった","V","③"],["him","彼","O",null]],"私はずっと彼が好きだ","like は状態動詞なので、進行形を使わず have liked で継続を表します。"),
 P([["You","あなた","S",null],["must","違いない","aux",null],["have","","aux",null],["been","だった","V","②"],["hungry","空腹な","a","C"]],"あなたはおなかがすいていたに違いない","must have p.p. で過去に対する推量。been は②、hungry は補語です。"),
 M("have助動詞が現在形（have / has）のときの呼び名は？",["現在完了","完了形","過去完了"],0,"原形なら完了形、過去形（had）なら過去完了です。"),
 M("次のうち<b>誤っている</b>英文は？",["I have seen him yesterday.","I saw him yesterday.","I have seen him before."],0,"現在完了は yesterday のような過去の時を明示する語句と一緒に使えません。"),
 M("現在完了の本質的な意味は？",["過去の動作・状態を表して、現在の状態を間接的に伝える","過去の動作だけをそのまま伝える","未来の予定を伝える"],0,"現在完了はあくまでも現在の状態を伝えるための表現です。"),
 M("<em>I have been to Kyoto.</em> の意味は？",["京都へ行ったことがある","京都へ行ってしまった","京都にずっといる"],0,"have been to は経験。have gone to なら「行ってしまって今いない」です。"),
 M("助動詞を重ねる正しい順番は？",["一般助動詞 → have → 進行のbe → 受身のbe","have → 一般助動詞 → 受身のbe → 進行のbe","受身のbe → 進行のbe → have → 一般助動詞"],0,"だから will have been being p.p. という並びになります。"),
 M("<em>He can't have done such a thing.</em> の意味は？",["そんなことをしたはずがない","そんなことをできなかった","そんなことをしてはいけない"],0,"can't have p.p. は「〜したはずがない」。"),
 M("完了進行形（have been -ing）について正しいのは？",["動作動詞で基準時までの継続を表す","状態動詞で経験を表す","どの動詞でも完了を表す"],0,"状態動詞は進行形にならないので、have p.p. で継続を表します。"),
 M("<em>By the end of this year I will have arrived back in Japan.</em> の時制は？",["未来完了","過去完了","現在完了"],0,"will have p.p. は未来の一時点の状態を伝える未来完了です。")
]}
];
const KL={n:"n　名詞",v:"v　動詞",a:"a　形容詞",ad:"ad　副詞",S:"S　主語",aux:"aux　助動詞","前":"前　前置詞",O:"O　目的語",V:"V　述語動詞",I:"誘導ad",X:"冠詞（書かない）"};
const LB={aux:"aux","前":"前",I:"誘導ad",X:'<span class="x">—</span>'};
const KEY="hinshi-drill-v2";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const sels={},picks={};
let L=0,cur=0,act=0,checked=false,mode="learn";
const $=id=>document.getElementById(id);
const items=()=>LS[L].items, it=()=>items()[cur], k=()=>L+"-"+cur;
const sel=()=>sels[k()]||(sels[k()]=it().w.map(()=>({p:null,t:null})));
const lab=(p,t)=>!p?"":(p==="V"&&t)?t:LB[p]||(t==="C"?p+"<sup>C</sup>":p);
const tight=w=>/^'|^n't/.test(w);

function tabs(){$("tabs").innerHTML=LS.map((l,i)=>`<button class="tab${i===L?" on":""}" data-l="${i}">${l.name}<small>${l.sub}</small></button>`).join("")}
function dots(){
  const n=items().filter((_,i)=>done[L+"-"+i]).length;
  $("dots").innerHTML=items().map((q,i)=>`<button class="dot${q.t==="m"?" mc":""}${done[L+"-"+i]?" done":""}${i===cur?" cur":""}" data-i="${i}" aria-label="問題${i+1}">${i+1}</button>`).join("");
  $("score").textContent=`正解 ${n} / ${items().length}`;
}
function ok(i){const w=it().w[i],s=sel()[i];return s.p===w[2]&&(w[3]==="*"||s.t===w[3])}
function bodyP(){
  const q=it(),s=sel();
  let h=`<div class="scroll"><div class="row" id="row">`+q.w.map((w,i)=>{
    let c="col"+(tight(w[0])?" tight":"");if(checked)c+=ok(i)?" ok":" ng";else if(i===act)c+=" sel";
    return `<button class="${c}" data-i="${i}"><span class="ja">${w[1]}</span><span class="en">${w[0]}</span><span class="pos">${lab(s[i].p,s[i].t)}</span></button>`;
  }).join("")+`<svg class="arcs" id="arcs"></svg></div></div><div class="panel">`;
  const a=s[act],w=q.w[act];
  h+=`<h3><b>${w[0]}</b> の下に書くのは？</h3><div class="btns">`+LS[L].keys.map(x=>`<button class="b${a.p===x?" on":""}" data-pos="${x}">${KL[x]}</button>`).join("")+`</div>`;
  if(a.p==="a"||a.p==="ad"||a.p==="前"){
    h+=`<h3>${a.p==="前"?"前置詞＋名詞が修飾する語は？":"働きは？（どの語を修飾する？）"}</h3><div class="btns">`;
    q.w.forEach((x,j)=>{if(j!==act)h+=`<button class="b${a.t===j?" on":""}" data-t="${j}">→ ${x[0]}</button>`});
    if(a.p==="a")h+=`<button class="b${a.t==="C"?" on":""}" data-t="C">補語（C）</button>`;
    h+=`<button class="b${a.t===null?" on":""}" data-t="none">わからない・なし</button></div>`;
  }else if(a.p==="n"&&LS[L].num){
    h+=`<h3>補語？</h3><div class="btns"><button class="b${a.t==="C"?" on":""}" data-t="C">補語（C）</button><button class="b${a.t===null?" on":""}" data-t="none">補語ではない（前置詞の目的語など）</button></div>`;
  }else if(a.p==="V"&&LS[L].num){
    h+=`<h3>動詞の番号は？（学校文法の捉え方）</h3><div class="btns">`+["①","②","③","④","⑤","-③","-④","-⑤"].map(n=>`<button class="b${a.t===n?" on":""}" data-t="${n}">${n}</button>`).join("")+`</div>`;
  }else h+=`<p class="hint">この記号は修飾先を選びません。</p>`;
  $("body").innerHTML=h+`</div>`;
  arcs();
}
function arcs(){
  const r=$("row"),svg=$("arcs");if(!r||!svg)return;const s=sel();
  const cols=[...r.querySelectorAll(".col")];
  const W=r.scrollWidth;svg.setAttribute("width",W);svg.setAttribute("viewBox",`0 0 ${W} 66`);
  const cx=i=>cols[i].offsetLeft+cols[i].offsetWidth/2;
  let p="";
  s.forEach((x,i)=>{
    if(typeof x.t!=="number")return;
    const a=cx(i),b=cx(x.t),d=Math.min(58,18+Math.abs(i-x.t)*11),dir=b>a?-1:1;
    p+=`<path d="M${a} 4 C${a} ${4+d},${b} ${4+d},${b+dir*3} 8" fill="none" stroke="var(--red)" stroke-width="1.8" marker-end="url(#ah)"/>`;
  });
  svg.innerHTML=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--red)"/></marker></defs>`+p;
}
function bodyM(){
  const q=it(),pk=picks[k()];
  $("body").innerHTML=`<p class="mcq">${q.q}</p><div class="mco">`+q.o.map((o,i)=>{
    let c="b";if(pk!==undefined){if(i===q.a)c+=" right";else if(i===pk)c+=" wrong"}
    return `<button class="${c}" data-o="${i}">${o}</button>`}).join("")+`</div>`;
}
function ansText(){
  const q=it();
  return q.w.map(w=>{const s=w[2]==="V"&&w[3]?"V "+w[3]:w[2]==="I"?"誘導ad":w[2]==="X"?"（記入しない）":w[3]==="C"?w[2]+"C":w[2];let t=w[0]+" = "+s;if(typeof w[3]==="number")t+=" → "+q.w[w[3]][0];return t}).join("　/　");
}
function render(){
  tabs();
  [...$("mode").children].forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  const dr=mode==="drill";$("barw").style.display=dr?"":"none";$("legend").style.display=dr?"":"none";$("reset").style.display=dr?"":"none";$("prev").style.display=dr?"":"none";$("next").style.display=dr?"":"none";
  if(!dr){$("qno").textContent=LS[L].name+"　"+LS[L].sub+"の要点";$("body").innerHTML=`<ol class="notes">${LS[L].notes.map(n=>`<li>${n}</li>`).join("")}</ol>`;$("check").style.display="";$("check").textContent="問題を解く →";$("res").className="res";return}
  dots();const q=it();
  $("qno").textContent=`${LS[L].name}　問題 ${cur+1}`+(q.t==="m"?"（確認）":"");
  const r=$("res");
  if(q.t==="p"){
    bodyP();$("check").style.display="";
    $("check").textContent=checked?"やり直す":"答え合わせ";
    if(checked){const all=q.w.every((_,i)=>ok(i));
      r.innerHTML=`<p class="v ${all?"ok":"ng"}">${all?"正解！":"もう一歩。赤枠の語を見直しましょう"}</p><p class="ans">${ansText()}</p><p>訳：${q.tr}</p><p>${q.ex}</p>`;r.className="res show";}
    else r.className="res";
  }else{
    bodyM();const pk=picks[k()];$("check").style.display=pk!==undefined?"":"none";$("check").textContent="やり直す";
    if(pk!==undefined){r.innerHTML=`<p class="v ${pk===q.a?"ok":"ng"}">${pk===q.a?"正解！":"不正解"}</p><p>${q.ex}</p>`;r.className="res show"}else r.className="res";
  }
  $("legend").innerHTML=LS[L].keys.map(x=>`<b>${x==="I"?"誘導ad":x==="X"?"—":x}</b> ${KL[x].replace(/^\S+\s/,"")}`).join("　")+"　／　<b>ªC</b> 形容詞で補語　／　赤い矢印＝修飾";
}
function go(i){const n=items().length;cur=(i+n)%n;act=0;checked=false;render()}

$("tabs").addEventListener("click",e=>{const t=e.target.closest(".tab");if(!t)return;L=+t.dataset.l;cur=0;act=0;checked=false;mode="learn";render()});
$("mode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.m;act=0;checked=false;render()});
$("body").addEventListener("click",e=>{
  const c=e.target.closest(".col");if(c){act=+c.dataset.i;checked=false;render();return}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.o!==undefined){if(picks[k()]!==undefined)return;const o=+b.dataset.o;picks[k()]=o;if(o===it().a){done[k()]=1;save()}render();return}
  const s=sel()[act],last=it().w.length-1;
  if(b.dataset.pos){s.p=b.dataset.pos;s.t=null;if(!["a","ad","前","V","n"].includes(s.p)||(s.p==="V"&&!LS[L].num)||(s.p==="n"&&!LS[L].num))act=Math.min(act+1,last)}
  else if(b.dataset.t){const t=b.dataset.t;s.t=t==="C"||/[①-⑤]/.test(t)?t:t==="none"?null:+t;act=Math.min(act+1,last)}
  checked=false;render();
});
$("check").addEventListener("click",()=>{
  if(mode==="learn"){mode="drill";cur=0;act=0;checked=false;render();return}
  const q=it();
  if(q.t==="m"){delete picks[k()];render();return}
  if(checked){sels[k()]=q.w.map(()=>({p:null,t:null}));checked=false;act=0;render();return}
  checked=true;if(q.w.every((_,i)=>ok(i))){done[k()]=1;save()}render();
});
$("prev").addEventListener("click",()=>go(cur-1));
$("next").addEventListener("click",()=>go(cur+1));
$("dots").addEventListener("click",e=>{const d=e.target.closest(".dot");if(d)go(+d.dataset.i)});
$("reset").addEventListener("click",()=>{Object.keys(done).forEach(x=>{if(x.startsWith(L+"-"))delete done[x]});save();render()});
const ro=new ResizeObserver(arcs);ro.observe($("body"));
if(document.fonts)document.fonts.ready.then(arcs);
render();
}
</script>
</body>
</html>
